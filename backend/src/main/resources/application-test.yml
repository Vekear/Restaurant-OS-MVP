# =====================================================================
# test：自动化测试 profile（restaurant_mvp_test + Redis db15，关闭定时任务）
# 由 @ActiveProfiles("test") 或 SPRING_PROFILES_ACTIVE=test 激活
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:restaurant_mvp_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      database: 15
  flyway:
    clean-disabled: false
    # 测试库已存在同版本 schema（无 flyway_schema_history），以 baseline 2 接管，跳过 V1/V2
    # 说明：数据库运维由 Lead 独占，测试不执行 clean/DROP，避免误伤共享环境
    baseline-on-migrate: true
    baseline-version: 2

management:
  endpoint:
    health:
      show-details: always

# 测试 profile 保持 API 文档开启（生产默认关闭，见 application.yml）
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

logging:
  level:
    com.restaurant: DEBUG
    org.springframework.web: INFO

app:
  storage:
    local:
      root: ./target/test-storage/files
  payment:
    mock-charge-amount: 0.01
    # 测试中回调地址不可达，走 ADR-0004 的降级直连处理（快速失败）
    mock-callback-base-url: http://127.0.0.1:1
  idempotency:
    ttl-hours: 24
  wechat:
    mock: true
  task:
    enabled: false
