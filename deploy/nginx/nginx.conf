# =============================================================================
# 餐厅点餐系统 MVP — Nginx 网关配置（Docker Compose 部署版）
#
# 职责（四层架构 · 网关层）：
#   1. 静态托管 Web 构建产物（web 容器构建 → web_dist 卷 → /usr/share/nginx/html）
#   2. /api/          反代 backend:8080
#   3. /files/        反代 backend:8080（storage.type=local 时由后端提供本地文件）
#   4. /ws            WebSocket Upgrade 反代（STOMP /ws 与原生 /ws/native 共用前缀）
#   5. /swagger-ui、/v3/api-docs 反代后端 SpringDoc
#   6. SPA fallback、gzip、请求体上限 10m、安全响应头
#
# 容器内校验： docker compose exec nginx nginx -t
# 本机模拟校验（无 Docker 时）：见 docs/06-deployment.md §6（把 backend:8080 替换为
# 127.0.0.1:8080、include 改为本机 mime.types 绝对路径后再 nginx -t）
# =============================================================================

worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # 图片上传 ≤5MB（业务白名单），网关留出 multipart 余量
    client_max_body_size 10m;
    client_body_timeout  60s;

    # ---- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 安全响应头 ----
    # 统一在 http 层下发：server/location 不再写 add_header，避免子级 add_header
    # 截断继承导致静态资源/错误页缺头；静态缓存策略改用 expires 表达。
    # HSTS 只在 HTTPS 入口启用；本机与 Docker 默认均为 HTTP，禁止默认下发：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP 暂不启用（M-04 已接受风险，启用前需梳理 Vite 产物与内联样式/脚本）：
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'self'" always;
    # X-XSS-Protection 已废弃且现代浏览器忽略，不再下发。
    add_header X-Content-Type-Options        nosniff always;
    add_header X-Frame-Options               SAMEORIGIN always;
    add_header Referrer-Policy               strict-origin-when-cross-origin always;
    add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy    same-origin always;

    # 反代响应若自带同名头，先隐藏再由网关统一下发，避免出现多值。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;

    # ---- WebSocket Upgrade 映射 ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ---------------------------------------------------------------------
        # 1) REST API —— 统一前缀 /api/v1
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ---------------------------------------------------------------------
        # 2) 本地文件访问（storage.type=local；后端 /files/** 静态映射）
        # ---------------------------------------------------------------------
        location /files/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            # 文件下载/图片展示不缓存协商，直接透传
            proxy_buffering    on;
        }

        # ---------------------------------------------------------------------
        # 3) WebSocket —— STOMP /ws 与原生 /ws/native（SockJS 回退走 HTTP）
        # ---------------------------------------------------------------------
        location /ws {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }

        # ---------------------------------------------------------------------
        # 4) Swagger UI / OpenAPI（/swagger-ui 前缀覆盖 /swagger-ui.html 与静态资源）
        # ---------------------------------------------------------------------
        location /swagger-ui {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # 4b) 后端健康检查透传（PLT-03 AC3：经网关返回 db/redis 组件状态）
        # ---------------------------------------------------------------------
        location = /actuator/health {
            access_log             off;
            proxy_pass             http://backend:8080;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_connect_timeout  5s;
            proxy_read_timeout     10s;
        }

        # ---------------------------------------------------------------------
        # 5) 前端构建产物（Vite：/assets/ 带 hash，可长缓存）
        # ---------------------------------------------------------------------
        location /assets/ {
            try_files $uri =404;
            # expires 生成 Cache-Control: max-age=604800；不在此 add_header，以继承 http 层安全头。
            expires 7d;
        }

        location = /index.html {
            # expires -1 生成 Cache-Control: no-cache，避免 location 级 add_header 截断继承。
            expires -1;
        }

        # ---------------------------------------------------------------------
        # 6) SPA fallback（history 路由）
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 网关存活探针（docker-compose healthcheck 使用，不打日志）
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
