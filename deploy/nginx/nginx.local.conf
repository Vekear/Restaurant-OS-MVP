# =============================================================================
# 餐厅点餐系统 MVP — Nginx 网关配置（本机 Windows 开发/联调版，非 Docker）
#
# 与本机环境对齐（见 docs/reference/brief.md §6）：
#   - nginx 二进制 : D:/Code_Environment/Nginx/nginx-1.30.6/nginx.exe（未在 PATH）
#   - 静态根       : E:/Ai_Code_Test/Text-All/File2/web/dist（pnpm build 产物）
#   - 后端         : http://127.0.0.1:8080
#   - 监听         : 127.0.0.1:80
#   - pid / 日志   : 项目 .runtime/nginx（已 gitignore）
#
# 启动/校验（在项目根执行）：
#   mkdir -p .runtime/nginx/logs .runtime/nginx/temp
#   nginx -t -p .runtime/nginx -c deploy/nginx/nginx.local.conf   # 用绝对路径更稳
#   nginx     -p .runtime/nginx -c deploy/nginx/nginx.local.conf
#   nginx -s stop -p .runtime/nginx -c deploy/nginx/nginx.local.conf
#
# 说明：pid / error_log / access_log / mime.types / root 均使用绝对路径，
#       保证在任意工作目录下 `nginx -t` 行为一致。
# =============================================================================

worker_processes  1;

pid        E:/Ai_Code_Test/Text-All/File2/.runtime/nginx/nginx.pid;
error_log  E:/Ai_Code_Test/Text-All/File2/.runtime/nginx/logs/error.log  warn;

events {
    worker_connections  1024;
}

http {
    include       D:/Code_Environment/Nginx/nginx-1.30.6/conf/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  E:/Ai_Code_Test/Text-All/File2/.runtime/nginx/logs/access.log  main;

    sendfile            on;
    keepalive_timeout   65;
    server_tokens       off;

    client_max_body_size 10m;
    client_body_timeout  60s;

    # ---- gzip ----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 安全响应头 ----
    # 统一在 http 层下发：server/location 不再写 add_header，避免子级 add_header
    # 截断继承导致静态资源/错误页缺头；静态缓存策略改用 expires 表达。
    # HSTS 只在 HTTPS 入口启用；本机开发为 HTTP，禁止默认下发：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP 暂不启用（M-04 已接受风险，启用前需梳理 Vite 产物与内联样式/脚本）：
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'self'" always;
    # X-XSS-Protection 已废弃且现代浏览器忽略，不再下发。
    add_header X-Content-Type-Options        nosniff always;
    add_header X-Frame-Options                SAMEORIGIN always;
    add_header Referrer-Policy               strict-origin-when-cross-origin always;
    add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy    same-origin always;

    # 反代响应若自带同名头，先隐藏再由网关统一下发，避免出现多值。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;

    # ---- WebSocket Upgrade 映射 ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       127.0.0.1:80;
        server_name  localhost 127.0.0.1;

        root   E:/Ai_Code_Test/Text-All/File2/web/dist;
        index  index.html;

        # ---------------------------------------------------------------------
        # 1) REST API → 本机后端 127.0.0.1:8080
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ---------------------------------------------------------------------
        # 2) 本地文件（storage.type=local）
        # ---------------------------------------------------------------------
        location /files/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # 3) WebSocket（STOMP /ws + 原生 /ws/native）
        # ---------------------------------------------------------------------
        location /ws {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }

        # ---------------------------------------------------------------------
        # 4) Swagger UI / OpenAPI
        # ---------------------------------------------------------------------
        location /swagger-ui {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------------
        # 4b) 后端健康检查透传（PLT-03 AC3：经网关返回 db/redis 组件状态）
        # ---------------------------------------------------------------------
        location = /actuator/health {
            access_log             off;
            proxy_pass             http://127.0.0.1:8080;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_connect_timeout  5s;
            proxy_read_timeout     10s;
        }

        # ---------------------------------------------------------------------
        # 5) 前端静态资源
        # ---------------------------------------------------------------------
        location /assets/ {
            try_files $uri =404;
            # expires 生成 Cache-Control: max-age=604800；不在此 add_header，以继承 http 层安全头。
            expires 7d;
        }

        location = /index.html {
            # expires -1 生成 Cache-Control: no-cache，避免 location 级 add_header 截断继承。
            expires -1;
        }

        # ---------------------------------------------------------------------
        # 6) SPA fallback
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 网关存活探针
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
