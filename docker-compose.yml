# =============================================================================
# 餐厅点餐系统 MVP — Docker Compose 服务编排（四层架构）
#
#   用户层 : web（构建产物一次性发布到命名卷 web_dist）
#   网关层 : nginx（静态托管 + /api /files /ws /swagger-ui /v3/api-docs）
#   应用层 : backend（Spring Boot 3 + Java 17，启动时 Flyway 自动迁移）
#   数据层 : mysql:8.0（utf8mb4）+ redis:7-alpine
#
# 使用：
#   cp .env.example .env          # 按需修改密钥/端口（.env 已被 .gitignore 忽略）
#   docker compose up -d --build
#   docker compose ps
#   open http://127.0.0.1/        # Web
#   open http://127.0.0.1/swagger-ui/index.html
#
# 说明：
#   - 本机无 Docker（brief §6），本文件仅做静态校验（scripts/check-compose.mjs）；
#     `docker compose up` 运行状态：未验证
#   - 宿主机端口默认避让本机已有服务：MySQL 13306、Redis 16379（3306/6379 被占用）
#   - 后端容器内服务名固定为 mysql / redis（见 backend.environment 覆盖）
#   - web 为一次性构建容器（发布静态产物后退出），nginx 依赖其成功退出
# =============================================================================

name: restaurant-mvp

services:
  # ---------------------------------------------------------------------------
  # 数据层：MySQL 8.0
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root123456}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-restaurant_mvp}"
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - restaurant-net

  # ---------------------------------------------------------------------------
  # 数据层：Redis 7（缓存 / 限流计数 / Spring Cache）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - restaurant-net

  # ---------------------------------------------------------------------------
  # 应用层：Spring Boot 3 后端（Flyway 自动迁移在应用启动时执行）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    image: restaurant-mvp-backend:local
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 生产/预发必须改为 docker（或 prod）并注入四个强随机密钥；dev 仅用于本机演示
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      # --- 数据库（容器内主机名固定为 mysql）---
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE:-restaurant_mvp}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root123456}"
      # --- Redis（容器内主机名固定为 redis）---
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DATABASE: "${REDIS_DATABASE:-0}"
      # --- JWT / 桌台二维码签名 ---
      JWT_SECRET: "${JWT_SECRET:-dev-only-jwt-secret-please-change-me-0123456789abcdef}"
      JWT_EXPIRES_IN_SECONDS: "${JWT_EXPIRES_IN_SECONDS:-7200}"
      TABLE_QR_SECRET: "${TABLE_QR_SECRET:-dev-only-table-qr-secret-please-change-me}"
      TABLE_QR_BASE_URL: "${TABLE_QR_BASE_URL:-http://localhost/t}"
      # --- 文件存储：local 为默认；oss 必须配全五项，缺失时启动 fail-fast（不静默降级）---
      STORAGE_TYPE: "${STORAGE_TYPE:-local}"
      STORAGE_LOCAL_DIR: /app/storage
      STORAGE_LOCAL_URL_PREFIX: /files
      STORAGE_MAX_SIZE_MB: "${STORAGE_MAX_SIZE_MB:-5}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      OSS_PUBLIC_BASE_URL: "${OSS_PUBLIC_BASE_URL:-}"
      OSS_DIR: "${OSS_DIR:-restaurant/}"
      OSS_POST_EXPIRE_SECONDS: "${OSS_POST_EXPIRE_SECONDS:-300}"
      # --- 微信小程序登录（无真实凭证时 mock）---
      WECHAT_MOCK: "${WECHAT_MOCK:-true}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      # --- 模拟支付 / 订单超时 ---
      PAYMENT_MOCK_CHARGE_AMOUNT: "${PAYMENT_MOCK_CHARGE_AMOUNT:-0.01}"
      # 回调基址：compose 用服务名 http://backend:8080；默认 127.0.0.1:8080 在 backend 容器内也指向自身
      PAYMENT_MOCK_CALLBACK_BASE_URL: http://backend:8080
      # 支付回调 HMAC 密钥（下方默认值仅 local 演示；非 local/test 未替换会 fail-fast）
      PAYMENT_CALLBACK_SECRET: "${PAYMENT_CALLBACK_SECRET:-dev-local-only-pay-callback-secret-please-change-me}"
      ORDER_PAYMENT_TIMEOUT_MINUTES: "${ORDER_PAYMENT_TIMEOUT_MINUTES:-15}"
      TABLE_SESSION_IDLE_MINUTES: "${TABLE_SESSION_IDLE_MINUTES:-120}"
      # --- 跨域 / 日志 / JVM ---
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m}"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - restaurant-net

  # ---------------------------------------------------------------------------
  # 用户层构建：Vue3 + Vite 构建 web/dist 并发布到命名卷（一次性容器）
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    image: restaurant-mvp-web:local
    restart: "no"
    volumes:
      - web_dist:/out
    networks:
      - restaurant-net

  # ---------------------------------------------------------------------------
  # 网关层：Nginx（唯一入口 80，静态托管 + 反向代理 + WebSocket Upgrade）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - web_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - restaurant-net

volumes:
  mysql_data:
    name: restaurant-mvp-mysql-data
  redis_data:
    name: restaurant-mvp-redis-data
  backend_storage:
    name: restaurant-mvp-storage
  web_dist:
    name: restaurant-mvp-web-dist

networks:
  restaurant-net:
    name: restaurant-mvp-net
    driver: bridge
